---
# Internal reusable workflow called by test.yaml and release.yaml.
# Install npm packages and build the document in separate jobs,
# so the build job running code of the repository and its dependencies doesn't have id-token: write.
name: Build document
on:
  workflow_call:
    inputs:
      repository:
        description: The repository (owner/repo) where the document exists. If empty, the repository where the workflow runs is used
        required: false
        type: string
      ref:
        description: The git ref to build. If empty, the default ref of actions/checkout is used
        required: false
        type: string
      working_directory:
        description: The directory where package.json and package-lock.json exist
        required: false
        type: string
        default: website
      node-version-file:
        required: false
        type: string
        default: website/.node-version
      build_dir:
        description: The directory where the built files are output
        required: false
        type: string
        default: website/build
      upload:
        description: If this is true, the built files are uploaded as an artifact
        required: false
        type: boolean
        default: false
      artifact_name:
        description: |
          The name of the artifact of the built files.
          The artifact of node_modules is named node_modules-<artifact_name>.
          Artifact names must be unique in a workflow run.
        required: false
        type: string
        default: document
    secrets:
      TAKUMI_GUARD_BOT_ID:
        required: false
    outputs:
      sha:
        description: The commit SHA where the document was built
        value: ${{jobs.npm.outputs.sha}}

permissions: {}

jobs:
  # Install npm packages through Takumi Guard, which requires id-token: write.
  npm:
    uses: suzuki-shunsuke/download-npm-package-action/.github/workflows/download.yaml@cd93d0e45a1804793f6daaf4c24bf55ccf12f494 # v0.0.4
    permissions:
      contents: read
      id-token: write
    with:
      repository: ${{inputs.repository}}
      ref: ${{inputs.ref}}
      working_directory: ${{inputs.working_directory}}
      node-version-file: ${{inputs.node-version-file}}
      artifact_name: node_modules-${{inputs.artifact_name}}
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}

  # Build the document in a job without write permissions.
  # Building the document runs code of the repository and its dependencies (install scripts, the build command, and so on).
  build:
    timeout-minutes: 30
    runs-on: ubuntu-26.04
    needs: npm
    permissions:
      contents: read
    steps:
      - name: Checkout the commit where npm packages were installed
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{inputs.repository}}
          ref: ${{needs.npm.outputs.sha}}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{inputs.node-version-file}}

      - name: Restore node_modules
        uses: suzuki-shunsuke/download-npm-package-action/restore@cd93d0e45a1804793f6daaf4c24bf55ccf12f494 # v0.0.4
        with:
          working_directory: ${{inputs.working_directory}}
          artifact_name: node_modules-${{inputs.artifact_name}}

      - name: Build the document
        working-directory: ${{inputs.working_directory}}
        run: npm run build

      - name: Upload the built files
        if: inputs.upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{inputs.artifact_name}}
          path: ${{inputs.build_dir}}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
