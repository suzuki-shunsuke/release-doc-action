---
name: test
permissions: {}
on: pull_request
concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true
jobs:
  # Don't add jobs to this file. Please add jobs to workflow_call_test.yaml.
  status-check:
    runs-on: ubuntu-26.04
    if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    timeout-minutes: 10
    permissions: {}
    needs:
      - test
    steps:
      - run: exit 1
  test:
    uses: $/.github/workflows/workflow_call_test.yaml
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}
    permissions:
      pull-requests: read
      contents: write # To test release.yaml. Files aren't pushed because of dry_run
      issues: write
      id-token: write
